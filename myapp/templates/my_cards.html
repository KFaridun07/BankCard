<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My cards</h1>

    {% for card in cards %}
    <a href="{% url 'card_detail' card.pk %}">
    <h3>{{ card.owner.firstname }} {{card.owner.lastname}}</h3>
    <p>{{ card.card_number }}</p>
    <p>{{ card.type }}</p>
    <p>{{ card.balance }}</p> <br> <br> <br>
    </a>
    {% endfor %}

    <a href="{% url 'create_card' %}"><button>Add card</button></a> <br> <br> <br>

    <a href=" {% url 'acc_detail' user.pk %}"><button >Account</button></a>


</body>
</html>
