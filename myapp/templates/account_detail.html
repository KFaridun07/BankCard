<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Account detail</h1>

    {{ account.user.phone }}
    <h3>{{ account.firstname }} {{ account.lastname }}</h3>
    <p>{{ account.passport_id }}</p>
    <p>{{ account.address }}</p>
    <p>{{ account.balance }}</p>

    <a href="{% url 'cards' %}"><button>My cards</button></a> <br> <br> <br>
    <a href="{% url 'transfer' %}"><button>Transfer</button></a> <br> <br>
    <a href="{% url 'transactions' %}"><button>Transactions</button></a> <br> <br> <br>


    <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
</body>
</html>
