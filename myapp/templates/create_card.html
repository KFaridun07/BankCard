<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Card | BankCard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0f172a;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        }

        .icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 5px;
        }

        .logo {
            text-align: center;
            color: #1e3a8a;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin: 10px 0;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .back {
            display: block;
            margin-top: 15px;
            padding: 13px;
            border-radius: 12px;
            background: #e2e8f0;
            color: #0f172a;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .back:hover {
            background: #cbd5e1;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #eff6ff;
            color: #1e40af;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="icon">💳</div>

        <div class="logo">
            BankCard
        </div>

        <h1>Create Card</h1>

        <div class="subtitle">
            Create a new bank card
        </div>


        <form action="" method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Create Card
            </button>
        </form>


        <a class="back" href="{% url 'acc_detail' request.user.account.pk %}">
            ← Back to Account
        </a>

        <a class="back" href="{% url 'cards' %}">
            💳 My Cards
        </a>


        <div class="info">
            Your card details will be generated securely by BankCard.
        </div>

    </div>

</div>

</body>
</html>
