<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer | BankCard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #071426, #0d2a4a, #1261a0);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .logo {
            text-align: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .logo span {
            color: #42a5ff;
        }

        .transfer-box {
            background: rgba(255, 255, 255, 0.97);
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        h1 {
            text-align: center;
            color: #172235;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #7b8794;
            font-size: 14px;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 18px;
            color: #26384d;
            font-weight: bold;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 13px 14px;
            margin-top: 7px;
            border: 1px solid #d5dce5;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            border-color: #1683e8;
            box-shadow: 0 0 0 3px rgba(22, 131, 232, 0.12);
        }

        .send-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #1683e8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .send-btn:hover {
            background: #0d6fc7;
            transform: translateY(-2px);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .buttons a {
            flex: 1;
            text-decoration: none;
        }

        .back-btn {
            display: block;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            background: #edf2f7;
            color: #26384d;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #dce5ef;
        }

        .security {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 500px) {
            .transfer-box {
                padding: 30px 22px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        Bank<span>Card</span>
    </div>

    <div class="transfer-box">

        <h1>Transfer Money</h1>

        <p class="subtitle">
            Send money securely to an account or card
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button class="send-btn" type="submit">
                Send Money
            </button>
        </form>

        <div class="buttons">

            <a href="{% url 'acc_detail' user.pk %}">
                <div class="back-btn">
                    ← Account
                </div>
            </a>

<a href="{% url 'transactions' %}">
                <div class="back-btn">
                    Transactions
                </div>
            </a>

        </div>

        <p class="security">
            🔒 Your transfer is processed securely
        </p>

    </div>

</div>

</body>
</html>
