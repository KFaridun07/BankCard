<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BankCard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0f172a;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            margin: 15px 0 8px;
            color: #0f172a;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .register {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .register:hover {
            text-decoration: underline;
        }

        .security {
            margin-top: 25px;
            padding: 13px;
            border-radius: 12px;
            background: #eff6ff;
            color: #1e40af;
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="login-card">

        <div class="icon">🏦</div>

        <div class="logo">
            BankCard
        </div>

        <h1>Welcome Back</h1>

        <div class="subtitle">
            Login to your banking account
        </div>


        <form method="post">
            {% csrf_token %}

            {{form.as_p}}

            <button type="submit">
                Login
            </button>
        </form>


        <a class="register" href="{% url 'register' %}">
            Don't have an account? Register
        </a>


        <div class="security">
            🔒 Your banking information is protected
        </div>

    </div>

</div>

</body>
</html>
